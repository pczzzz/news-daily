# ============================================================
# 每日资讯日报 · 订阅源配置
# 修改后无需改代码，Actions 下次运行自动生效
# ============================================================

settings:
  timezone: "Asia/Shanghai"
  # 每个源最多取几条
  max_per_source: 6
  # 低于该分数的条目直接丢弃（0-100）
  min_score: 35
  # 去重历史保留天数
  history_days: 10
  # 单个源请求超时（秒）
  request_timeout: 20
  # 并发抓取数
  concurrency: 8
  # 日报最多收录条数
  max_items: 40
  # 单个板块最多收录条数（防止科技/快讯类源挤占其他板块）
  max_per_category: 12
  # ---- 原文正文 + 中文翻译 ----
  # 是否抓取每条新闻的原文正文（失败自动降级为 RSS 摘要）
  enrich_article: true
  # 每篇最多保留几段正文（太多会让日报变长，10 段约 1500-2500 字）
  article_paragraphs: 10
  # 是否把标题/摘要/正文逐段翻译成中文（直译，不改写不总结）
  translate: true
  # 翻译并发数（太大容易被 Google 限流）
  translate_concurrency: 6
  # 只收录多少天内的新闻（超过的旧闻直接丢弃）
  max_age_days: 7

# ------------------------------------------------------------
# 评分关键词：标题/摘要命中即加分
# 分越高越靠前。可自由增删。
# ------------------------------------------------------------
keywords:
  # 重大事件（+40）
  critical:
    - 战争
    - 开战
    - 导弹
    - 核武
    - 政变
    - 停火
    - 制裁
    - 大选
    - 遇刺
    - 宣战
    - 军事演习
    - war
    - missile
    - nuclear
    - coup
    - ceasefire
    - sanction
    - election
    - invasion
    - airstrike
    - assassination
  # 重要动态（+20）
  major:
    - 外交
    - 谈判
    - 峰会
    - 议会
    - 总统
    - 首相
    - 国防
    - 军队
    - 边境
    - 决议
    - 条约
    - diplomacy
    - negotiation
    - summit
    - parliament
    - president
    - prime minister
    - defense
    - troops
    - border
    - treaty
    - alliance
    - NATO
  # 有信息量（+8）
  useful:
    - 分析
    - 报告
    - 数据
    - 局势
    - 冲突
    - 政策
    - analysis
    - report
    - strategy
    - conflict
    - policy
    - intelligence

  # 科技新闻专属（+20）：仅在 category 为「科技新闻」时生效
  tech:
    - 人工智能
    - 大模型
    - 芯片
    - 半导体
    - 算力
    - 量子计算
    - 机器人
    - 自动驾驶
    - 航天
    - 火箭
    - 卫星
    - 操作系统
    - 开源
    - 云计算
    - 数据中心
    - 英伟达
    - 苹果
    - 特斯拉
    - 微软
    - 谷歌
    - 华为
    - 字节跳动
    - AI
    - LLM
    - GPT
    - ChatGPT
    - Gemini
    - Claude
    - OpenAI
    - Nvidia
    - GPU
    - chip
    - semiconductor
    - quantum
    - robot
    - robotaxi
    - satellite
    - SpaceX
    - Starship
    - Apple
    - Tesla
    - Microsoft
    - Google
    - Meta
    - Amazon
    - startup
    - data center
    - cybersecurity

# 降权词：命中扣分（避免标题党、纯情绪、广告）
penalties:
  - 震惊
  - 刚刚
  - 速看
  - 点击
  - 广告
  - 直播预告

