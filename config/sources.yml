# ============================================================
# 每日资讯日报 · 订阅源配置
# 修改后无需改代码，Actions 下次运行自动生效
# ============================================================

settings:
  timezone: "Asia/Shanghai"
  # 每个源最多取几条
  max_per_source: 4
  # 低于该分数的条目直接丢弃（0-100）
  min_score: 35
  # 去重历史保留天数
  history_days: 10
  # 单个源请求超时（秒）
  request_timeout: 20
  # 并发抓取数
  concurrency: 8
  # 日报最多收录条数
  max_items: 70
  # 单个板块最多收录条数（防止热门板块把冷门板块挤没）
  max_per_category: 6
  # 只收录多少天内的新闻（超过的旧闻直接丢弃）
  max_age_days: 7

  # ---- 原文正文 + 中文翻译 ----
  # 是否抓取每条新闻的原文正文（失败自动降级为 RSS 摘要）
  enrich_article: true
  # 每篇最多保留几段正文（6 段约 1000-1500 字，板块多时要控制）
  article_paragraphs: 6
  # 是否把标题/摘要/正文逐段翻译成中文（直译，不改写不总结）
  translate: true
  # 每篇文章内部的翻译分批并发数
  translate_concurrency: 4
  # 同时处理几篇文章（抓正文 + 翻译）
  article_concurrency: 6

# ------------------------------------------------------------
