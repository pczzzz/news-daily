name: 每日资讯日报

# 北京时间每天 07:30 自动跑（cron 用 UTC，23:30 = 次日 07:30 北京）
#
# 双保险：GitHub 的定时任务在 UTC 0 点前后是调度高峰，实测每天延迟 30~45 分钟，
# 遇到拥堵还会直接丢弃该次调度（2026-11-19 就整次没跑）。
# 所以再加一个 09:30 的补救时间点：脚本先检查当天文件是否已存在，已存在就跳过。
on:
  schedule:
    - cron: "30 23 * * *"   # 北京 07:30
    - cron: "30 1 * * *"    # 北京 09:30（补救）
  workflow_dispatch: # 手动运行总是执行，不做去重

permissions:
  contents: write         # 需要写回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 检查今天是否已生成
        id: guard
        run: |
          TODAY=$(date -u -d '+8 hours' +%Y-%m-%d)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "docs/daily/$TODAY.md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "今天的日报已存在（$TODAY.md），跳过本次调度"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "开始生成 $TODAY 的日报"
          fi

      - name: 安装 Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: 抓取并生成日报
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/fetch_news.py

      - name: 提交结果
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "没有新内容，跳过提交"
          else
            git commit -m "chore: 更新 $(date -u -d '+8 hours' +%Y-%m-%d) 日报"
            git push
          fi
