name: diagFin
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests feedparser PyYAML beautifulsoup4 lxml
      - run: python scripts/diag_fin.py
